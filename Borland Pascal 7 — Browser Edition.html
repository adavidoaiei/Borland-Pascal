<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Borland Pascal 7 — Browser Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --fs:24px; --lh:20px; --blue:#0000AA; --gray:#AAAAAA; --cyan:#00AAAA; --green:#00AA00; --red:#AA0000; --yellow:#FFFF55;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{font-family:'VT323','Lucida Console','Courier New',monospace;font-size:var(--fs);line-height:var(--lh);color:#000;font-variant-ligatures:none;-webkit-text-size-adjust:100%}
#ide{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);display:flex;flex-direction:column;background:var(--blue)}
.hk{color:var(--red);font-weight:normal}
/* menu bar */
#menubar{height:var(--lh);background:var(--gray);display:flex;white-space:pre;position:relative;flex:none;user-select:none;-webkit-user-select:none}
.mi{padding:0 1.5ch;cursor:default}
.mi.sel{background:var(--green)}
#clock{margin-left:auto;padding-right:1ch}
.dd{position:absolute;z-index:50;background:var(--gray);border:1px solid #000;padding:2px 0;box-shadow:1ch var(--lh) 0 -0px rgba(0,0,0,.55);min-width:26ch;user-select:none;-webkit-user-select:none}
.dd .row{display:flex;justify-content:space-between;padding:0 1ch 0 2.5ch;white-space:pre;position:relative;cursor:default}
.dd .row .ck{position:absolute;left:.8ch}
.dd .row.sel{background:var(--green)}
.dd .row.off{color:#555}
.dd .row.off .hk{color:#555}
.dd .sep{height:var(--lh);position:relative}
.dd .sep:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid #000}
.dd .kb{margin-left:3ch}
#errbar{position:absolute;left:0;right:0;top:0;height:var(--lh);background:var(--red);color:#fff;z-index:60;padding:0 1ch;display:none;white-space:pre}
/* desk and window */
#desk{position:relative;flex:1;min-height:0;padding:calc(var(--lh)/2) 0;background:var(--blue)}
#win{position:absolute;left:0;right:0;top:calc(var(--lh)/2);bottom:calc(var(--lh)/2);border:5px double #fff;background:var(--blue)}
.lab{position:absolute;z-index:5;background:var(--blue);color:#fff;white-space:pre;line-height:var(--lh)}
#wtitle{top:calc(-2.5px - var(--lh)/2);left:50%;transform:translateX(-50%);padding:0 1ch;cursor:default}
#wclose{top:calc(-2.5px - var(--lh)/2);left:2ch;color:#55FF55;cursor:pointer}
#wnum{top:calc(-2.5px - var(--lh)/2);right:6ch}
#wzoom{top:calc(-2.5px - var(--lh)/2);right:2ch;color:#55FF55}
#wpos{bottom:calc(-2.5px - var(--lh)/2);left:2ch;padding:0 1ch}
#editwrap{position:absolute;left:0;top:0;right:1ch;bottom:var(--lh);overflow:hidden;background:var(--blue)}
#ta,#hl{position:absolute;left:0;top:0;margin:0;border:0;padding:0 0 0 1ch;font:inherit;line-height:var(--lh);white-space:pre;tab-size:2;-moz-tab-size:2;letter-spacing:0;font-variant-ligatures:none}
#ta{width:100%;height:100%;resize:none;outline:none;background:transparent;color:transparent;caret-color:var(--yellow);caret-shape:underscore;overflow:auto;scrollbar-width:none;-webkit-text-size-adjust:100%}

#ta::selection{background:var(--cyan);color:transparent}
#hl{pointer-events:none;color:var(--yellow);overflow:visible;width:max-content;min-width:100%}
#hl .k{color:#fff}#hl .c{color:#AAAAAA}#hl .s{color:#55FF55}#hl .n{color:#55FFFF}
#hl.plain .k,#hl.plain .c,#hl.plain .s,#hl.plain .n{color:var(--yellow)}
.sb{position:absolute;background:var(--cyan);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#vs{right:0;top:0;bottom:var(--lh);width:1ch}
#hs{left:0;right:1ch;bottom:0;height:var(--lh)}
#corner{right:0;bottom:0;width:1ch;height:var(--lh);background:var(--gray)}
.sb .ar{position:absolute;background:var(--gray);color:#000;text-align:center;line-height:var(--lh);height:var(--lh);width:1ch;cursor:pointer}
#vs .ar.u{top:0}#vs .ar.d{bottom:0}#hs .ar{top:0}#hs .ar.l{left:0}#hs .ar.r{right:0}

#vs .th{left:0;right:0}#hs .th{top:0;bottom:0}

#status span{padding:0 1.5ch;cursor:pointer;flex:none}
#status span:hover{background:var(--green)}

#ufoot button{font:inherit;background:var(--green);color:#000;border:0;padding:0 1.5ch;cursor:pointer;line-height:inherit}
#kb{position:absolute;left:-1000px;top:0;width:10px;height:10px;opacity:0}

.ovl{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.001)}
.dlg{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);background:var(--gray);border:5px double #fff;padding:calc(var(--lh)*.6) 2ch calc(var(--lh)*.5);box-shadow:1ch var(--lh) 0 rgba(0,0,0,.55);max-width:calc(100vw - 2ch);max-height:92%;display:flex;flex-direction:column}
.dttl{position:absolute;top:calc(-2.5px - var(--lh)/2 - 5px);left:50%;transform:translateX(-50%);background:var(--gray);padding:0 1ch;white-space:pre;color:#000}
.dbody{white-space:pre-wrap;overflow:auto;min-height:0}
.dbody.pre{white-space:pre}
.dbtns{display:flex;gap:2ch;justify-content:center;margin-top:calc(var(--lh)*.7);flex-wrap:wrap}
.btn{font:inherit;line-height:var(--lh);background:var(--green);color:#000;border:0;padding:0 2ch;cursor:pointer;box-shadow:1px 1px 0 #000;min-width:10ch}
.btn.def{color:#fff}.btn:focus{outline:2px solid #fff;outline-offset:1px}
.dlg input[type=text]{font:inherit;line-height:var(--lh);width:100%;background:var(--blue);color:#fff;border:0;outline:0;padding:0 1ch;caret-color:var(--yellow)}

.flist{height:calc(var(--lh)*8);overflow:auto;background:#fff;color:#000;margin-top:calc(var(--lh)*.4);border:1px solid #000}
.flist div{padding:0 1ch;white-space:pre;cursor:pointer;display:flex;justify-content:space-between;gap:2ch}
.flist div.sel{background:var(--cyan)}
.flist div i{font-style:normal;color:#555}
.kv{white-space:pre}
.kv.ok{color:#000}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>

      <span id="wzoom" class="lab">[↑]</span>

  </div>
  <div id="status"></div>
</div>
<div id="user">
  <div id="uwrap"><canvas id="screen"></canvas></div>
  <div id="ufoot"></div>

</div>
<div id="dlgroot"></div>

const SAMPLES={"BOUNCE.PAS": "{ BOUNCE.PAS - animation with Delay and KeyPressed }\nprogram Bounce;\nuses Crt;\nvar\n  X, Y, DX, DY: Integer;\nbegin\n  ClrScr;\n  TextColor(LightGray);\n  GotoXY(2, 1); Write('Bouncing ball - press any key to stop');\n  X := 10; Y := 5; DX := 1; DY := 1;\n  repeat\n    GotoXY(X, Y);\n    Write(' ');\n    X := X + DX;\n    Y := Y + DY;\n    if (X <= 1) or (X >= 79) then DX := -DX;\n    if (Y <= 2) or (Y >= 24) then DY := -DY;\n    GotoXY(X, Y);\n    TextColor(Yellow);\n    Write(#2);\n    Delay(25);\n  until KeyPressed;\n  ReadKey;\n  ClrScr;\n  WriteLn('Done.');\nend.\n", "BOXES.PAS": "{ BOXES.PAS - text-mode windows with line-drawing characters }\nprogram Boxes;\nuses Crt;\n\nprocedure Box(X1, Y1, X2, Y2, Fore, Back: Integer; const Title: string);\nvar\n  i, j: Integer;\nbegin\n  TextColor(Fore);\n  TextBackground(Back);\n  GotoXY(X1, Y1); Write(#201);\n  for i := X1 + 1 to X2 - 1 do Write(#205);\n  Write(#187);\n  for j := Y1 + 1 to Y2 - 1 do\n  begin\n    GotoXY(X1, j); Write(#186);\n    for i := X1 + 1 to X2 - 1 do Write(' ');\n    Write(#186);\n  end;\n  GotoXY(X1, Y2); Write(#200);\n  for i := X1 + 1 to X2 - 1 do Write(#205);\n  Write(#188);\n  GotoXY(X1 + 2, Y1); Write(' ', Title, ' ');\n  { shadow }\n  TextBackground(Black);\n  TextColor(DarkGray);\n  for j := Y1 + 1 to Y2 + 1 do begin GotoXY(X2 + 1, j); Write(#177#177); end;\n  GotoXY(X1 + 2, Y2 + 1);\n  for i := X1 + 2 to X2 + 2 do Write(#177);\nend;\n\nbegin\n  TextBackground(Blue);\n  ClrScr;\n  Box(5, 3, 40, 12, White, Cyan, 'Hello');\n  TextColor(Black); TextBackground(Cyan);\n  GotoXY(8, 6);  Write('Text mode is still fun.');\n  GotoXY(8, 8);  Write('CP437 box characters work.');\n  Box(30, 9, 70, 20, Yellow, Red, 'Warning');\n  TextColor(White); TextBackground(Red);\n  GotoXY(34, 13); Write('Overlapping windows!');\n  TextColor(LightGray); TextBackground(Black);\n  GotoXY(1, 24);\n  Write('Press any key');\n  ReadKey;\n  TextBackground(Black);\n  ClrScr;\nend.\n", "FIBO.PAS": "{ FIBO.PAS - recursion }\nprogram Fibonacci;\nvar\n  n: Integer;\n\nfunction Fib(n: Integer): LongInt;\nbegin\n  if n < 2 then\n    Fib := n\n  else\n    Fib := Fib(n - 1) + Fib(n - 2);\nend;\n\nbegin\n  WriteLn('Fibonacci numbers');\n  WriteLn('-----------------');\n  for n := 0 to 24 do\n    WriteLn('Fib(', n:2, ') = ', Fib(n):6);\nend.\n", "GUESS.PAS": "{ GUESS.PAS - input and a loop }\nprogram Guess;\nuses Crt;\nvar\n  Secret, Try, Tries: Integer;\nbegin\n  Randomize;\n  ClrScr;\n  Secret := Random(100) + 1;\n  Tries := 0;\n  WriteLn('I am thinking of a number from 1 to 100.');\n  repeat\n    Write('Your guess? ');\n    ReadLn(Try);\n    Inc(Tries);\n    if Try < Secret then WriteLn('Too low!')\n    else if Try > Secret then WriteLn('Too high!');\n  until Try = Secret;\n  WriteLn('Correct! You needed ', Tries, ' guesses.');\nend.\n", "HELLO.PAS": "{ HELLO.PAS - a first taste of Pascal }\nprogram Hello;\nuses Crt;\nvar\n  i: Integer;\nbegin\n  ClrScr;\n  TextColor(Yellow);\n  WriteLn('Hello, world!');\n  TextColor(LightCyan);\n  WriteLn('Borland Pascal lives on... in your browser.');\n  WriteLn;\n  for i := 1 to 10 do\n  begin\n    TextColor(i + 1);\n    WriteLn(i:2, ' squared is ', i * i:3);\n  end;\n  TextColor(LightGray);\n  WriteLn;\n  Write('Press any key...');\n  ReadKey;\nend.\n", "LIFE.PAS": "{ LIFE.PAS - Conway's Game of Life on a wrapping board }\nprogram Life;\nuses Crt;\nconst\n  W = 60;\n  H = 22;\ntype\n  TBoard = array[0..H - 1, 0..W - 1] of Boolean;\nvar\n  A, B: TBoard;\n  X, Y, Gen: Integer;\n\nfunction Neighbours(var G: TBoard; X, Y: Integer): Integer;\nvar\n  DX, DY, N: Integer;\nbegin\n  N := 0;\n  for DY := -1 to 1 do\n    for DX := -1 to 1 do\n      if (DX <> 0) or (DY <> 0) then\n        if G[(Y + DY + H) mod H, (X + DX + W) mod W] then Inc(N);\n  Neighbours := N;\nend;\n\nbegin\n  ClrScr;\n  for Y := 0 to H - 1 do\n    for X := 0 to W - 1 do\n      A[Y, X] := Random(4) = 0;\n  Gen := 0;\n  repeat\n    GotoXY(1, 1);\n    TextColor(LightGreen);\n    for Y := 0 to H - 1 do\n    begin\n      for X := 0 to W - 1 do\n        if A[Y, X] then Write(#219) else Write(' ');\n      WriteLn;\n    end;\n    TextColor(LightGray);\n    Write('Generation ', Gen, '  - press a key to stop');\n    for Y := 0 to H - 1 do\n      for X := 0 to W - 1 do\n        case Neighbours(A, X, Y) of\n          2: B[Y, X] := A[Y, X];\n          3: B[Y, X] := True;\n        else\n          B[Y, X] := False;\n        end;\n    A := B;\n    Inc(Gen);\n    Delay(60);\n  until KeyPressed;\n  ReadKey;\n  ClrScr;\nend.\n", "LISTS.PAS": "{ LISTS.PAS - records and pointers }\nprogram Lists;\ntype\n  PNode = ^TNode;\n  TNode = record\n    Name: string;\n    Age: Integer;\n    Next: PNode;\n  end;\nvar\n  Head, P: PNode;\n\nprocedure Push(const AName: string; AAge: Integer);\nvar N: PNode;\nbegin\n  New(N);\n  N^.Name := AName;\n  N^.Age := AAge;\n  N^.Next := Head;\n  Head := N;\nend;\n\nfunction Count: Integer;\nvar C: Integer;\n    Q: PNode;\nbegin\n  C := 0; Q := Head;\n  while Q <> nil do begin Inc(C); Q := Q^.Next; end;\n  Count := C;\nend;\n\nbegin\n  Head := nil;\n  Push('Ada', 36);\n  Push('Niklaus', 78);\n  Push('Anders', 63);\n  Push('Philippe', 70);\n  P := Head;\n  while P <> nil do\n  begin\n    WriteLn(P^.Name:10, P^.Age:5);\n    P := P^.Next;\n  end;\n  WriteLn('Total: ', Count, ' people');\nend.\n", "MANDEL.PAS": "{ MANDEL.PAS - the Mandelbrot set in text mode }\nprogram Mandel;\nuses Crt;\nconst\n  Cols = 78;\n  Rows = 24;\n  MaxIter = 40;\nvar\n  X, Y, Iter: Integer;\n  Cr, Ci, Zr, Zi, T: Real;\nbegin\n  ClrScr;\n  for Y := 0 to Rows - 1 do\n  begin\n    for X := 0 to Cols - 1 do\n    begin\n      Cr := -2.2 + X * 3.2 / Cols;\n      Ci := -1.15 + Y * 2.3 / Rows;\n      Zr := 0; Zi := 0; Iter := 0;\n      while (Iter < MaxIter) and (Zr * Zr + Zi * Zi < 4) do\n      begin\n        T := Zr * Zr - Zi * Zi + Cr;\n        Zi := 2 * Zr * Zi + Ci;\n        Zr := T;\n        Inc(Iter);\n      end;\n      if Iter = MaxIter then\n      begin\n        TextColor(Black); Write(' ');\n      end\n      else\n      begin\n        TextColor(9 + Iter mod 7);\n        case Iter mod 4 of\n          0: Write(#176);\n          1: Write(#177);\n          2: Write(#178);\n          3: Write(#219);\n        end;\n      end;\n    end;\n    WriteLn;\n  end;\n  TextColor(LightGray);\n  Write('Press any key');\n  ReadKey;\nend.\n", "PRIMES.PAS": "{ PRIMES.PAS - Sieve of Eratosthenes }\nprogram Primes;\nconst\n  Max = 500;\nvar\n  Sieve: array[2..Max] of Boolean;\n  i, j, Count: Integer;\nbegin\n  for i := 2 to Max do Sieve[i] := True;\n  for i := 2 to Max do\n    if Sieve[i] then\n    begin\n      j := i * 2;\n      while j <= Max do\n      begin\n        Sieve[j] := False;\n        j := j + i;\n      end;\n    end;\n  Count := 0;\n  for i := 2 to Max do\n    if Sieve[i] then\n    begin\n      Write(i:5);\n      Inc(Count);\n      if Count mod 12 = 0 then WriteLn;\n    end;\n  WriteLn;\n  WriteLn;\n  WriteLn(Count, ' primes below ', Max);\nend.\n", "SORTS.PAS": "{ SORTS.PAS - arrays, procedures, var parameters }\nprogram Sorts;\nconst\n  N = 16;\ntype\n  TList = array[1..N] of Integer;\nvar\n  A: TList;\n  i: Integer;\n\nprocedure Swap(var X, Y: Integer);\nvar T: Integer;\nbegin\n  T := X; X := Y; Y := T;\nend;\n\nprocedure Show(const Title: string; var L: TList);\nvar k: Integer;\nbegin\n  Write(Title, ': ');\n  for k := 1 to N do Write(L[k], ' ');\n  WriteLn;\nend;\n\nprocedure BubbleSort(var L: TList);\nvar\n  Pass, k: Integer;\n  Done: Boolean;\nbegin\n  for Pass := 1 to N - 1 do\n  begin\n    Done := True;\n    for k := 1 to N - Pass do\n      if L[k] > L[k + 1] then\n      begin\n        Swap(L[k], L[k + 1]);\n        Done := False;\n      end;\n    if Done then Break;\n  end;\nend;\n\nbegin\n  Randomize;\n  for i := 1 to N do A[i] := Random(90) + 10;\n  Show('Before', A);\n  BubbleSort(A);\n  Show('After ', A);\nend.\n"};
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const opts=Object.assign({syn:true,auto:true,scale:1},store.get('bp7.opts',{}));
const ta=$('#ta'),hl=$('#hl'),userEl=$('#user'),foot=$('#ufoot');
let cur={name:'NONAME00.PAS',dirty:false};
let lastErr=null;

/* ============ sizing ============ */
let ratio=0.4;
function measureRatio(){
  try{const c=document.createElement('canvas').getContext('2d');c.font='100px VT323, "Lucida Console", monospace';const w=c.measureText('M').width/100;if(w>0.2&&w<1)ratio=w}catch(e){}
}
function layout(){
  const w=window.innerWidth,h=window.innerHeight;
  let fs=Math.min(w/(80*ratio),h/26/0.82,32)*opts.scale;
  fs=Math.max(15,Math.round(fs));
  const r=document.documentElement.style;
  r.setProperty('--fs',fs+'px');r.setProperty('--lh',Math.round(fs*0.82)+'px');
  syncScroll();sizeScreen();
}
/* ============ highlighting ============ */
const KW=new Set(P.KW);['exit','break','continue','otherwise'].forEach(k=>KW.add(k));
const TOK=/(\{[^}]*\}?|\(\*[\s\S]*?(?:\*\)|$)|\/\/[^\n]*)|('(?:[^'\n]|'')*'?|#\$?[0-9A-Fa-f]+)|(\$[0-9A-Fa-f]+|\b\d+\.?\d*(?:[eE][+-]?\d+)?\b)|([A-Za-z_]\w*)/g;
function highlight(src){
  let out='',last=0,m;TOK.lastIndex=0;
  while((m=TOK.exec(src))){
    out+=esc(src.slice(last,m.index));
    const t=esc(m[0]);
    if(m[1])out+='<span class="c">'+t+'</span>';
    else if(m[2])out+='<span class="s">'+t+'</span>';
    else if(m[3])out+='<span class="n">'+t+'</span>';
    else out+=KW.has(m[4].toLowerCase())?'<span class="k">'+t+'</span>':t;
    last=m.index+m[0].length;
  }
  return out+esc(src.slice(last));
}
function render(){
  hl.innerHTML=highlight(ta.value)+'\n ';
  hl.className=opts.syn?'':'plain';
  syncScroll();updatePos();
}
function syncScroll(){
  hl.style.transform='translate('+(-ta.scrollLeft)+'px,'+(-ta.scrollTop)+'px)';
  updateBars();
}
function updatePos(){
  const v=ta.value,p=ta.selectionStart,b=v.slice(0,p).split('\n');
  $('#wpos').textContent=(cur.dirty?'*':'')+b.length+':'+(b[b.length-1].length+1);
}
function setTitle(){$('#wtitle').textContent=' '+cur.name+' ';document.title=cur.name+' — Borland Pascal';}
/* scrollbars */
function updateBars(){
  const vt=$('#vs .tr'),vth=$('#vs .th'),ht=$('#hs .tr'),hth=$('#hs .th');
  const V=vt.clientHeight,Hh=ht.clientWidth;
  const ch=ta.clientHeight,sh=ta.scrollHeight,cw=ta.clientWidth,sw=ta.scrollWidth;
  const lh=parseFloat(getComputedStyle(ta).lineHeight)||20;
  let th=Math.max(lh,V*ch/Math.max(sh,1));if(sh<=ch)th=V;
  vth.style.height=Math.min(th,V)+'px';vth.style.top=(sh>ch?(V-th)*ta.scrollTop/(sh-ch):0)+'px';
  let tw=Math.max(lh,Hh*cw/Math.max(sw,1));if(sw<=cw)tw=Hh;
  hth.style.width=Math.min(tw,Hh)+'px';hth.style.left=(sw>cw?(Hh-tw)*ta.scrollLeft/(sw-cw):0)+'px';
}
function dragThumb(bar,vertical){
  const tr=$(bar+' .tr'),th=$(bar+' .th');
  tr.addEventListener('pointerdown',e=>{
    e.preventDefault();
    const rect=tr.getBoundingClientRect();
    const tlen=vertical?th.offsetHeight:th.offsetWidth,len=vertical?rect.height:rect.width;
    const move=ev=>{
      const pos=(vertical?ev.clientY-rect.top:ev.clientX-rect.left)-tlen/2;
      const f=Math.max(0,Math.min(1,pos/Math.max(1,len-tlen)));
      if(vertical)ta.scrollTop=f*(ta.scrollHeight-ta.clientHeight);else ta.scrollLeft=f*(ta.scrollWidth-ta.clientWidth);
    };
    move(e);
    const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up)};
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
  });
}
dragThumb('#vs',true);dragThumb('#hs',false);
function arrow(sel,dx,dy){$(sel).addEventListener('pointerdown',e=>{e.preventDefault();ta.scrollBy(dx*ta.clientWidth/8,dy*(parseFloat(getComputedStyle(ta).lineHeight)||20)*2)})}
arrow('#vs .u',0,-1);arrow('#vs .d',0,1);arrow('#hs .l',-1,0);arrow('#hs .r',1,0);

/* ============ editor behaviour ============ */
ta.addEventListener('input',()=>{cur.dirty=true;render();autosave()});
ta.addEventListener('scroll',syncScroll);
['keyup','click','select','focus'].forEach(ev=>ta.addEventListener(ev,updatePos));
document.addEventListener('selectionchange',()=>{if(document.activeElement===ta)updatePos()});
let saveT=null;
function autosave(){clearTimeout(saveT);saveT=setTimeout(()=>store.set('bp7.cur',{name:cur.name,text:ta.value,dirty:cur.dirty}),400)}
function insertText(s){ta.focus();if(!document.execCommand('insertText',false,s)){const a=ta.selectionStart,b=ta.selectionEnd;ta.setRangeText(s,a,b,'end');ta.dispatchEvent(new Event('input'))}}
ta.addEventListener('keydown',e=>{
  if(e.key==='Tab'&&!e.ctrlKey&&!e.altKey){e.preventDefault();if(!e.shiftKey)insertText('  ');return}
  if(e.key==='Enter'&&opts.auto&&!e.ctrlKey&&!e.altKey&&!e.metaKey){
    e.preventDefault();
    const v=ta.value,s=ta.selectionStart,ls=v.lastIndexOf('\n',s-1)+1,line=v.slice(ls,s);
    let ind=line.match(/^[ \t]*/)[0];
    if(/(\b(begin|repeat|record|of|then|do|else)|\bcase\b.*\bof)\s*$/i.test(line.replace(/\{.*\}|\/\/.*$/,'')))ind+='  ';
    insertText('\n'+ind);
  }
});
function gotoLine(n,col){
  const lines=ta.value.split('\n');n=Math.max(1,Math.min(lines.length,n));
  let pos=0;for(let i=0;i<n-1;i++)pos+=lines[i].length+1;
  pos+=Math.min((col||1)-1,lines[n-1].length);
  ta.focus();ta.setSelectionRange(pos,pos);
  const lh=parseFloat(getComputedStyle(ta).lineHeight)||20;
  const top=(n-1)*lh;
  if(top<ta.scrollTop||top>ta.scrollTop+ta.clientHeight-2*lh)ta.scrollTop=Math.max(0,top-ta.clientHeight/3);
  updatePos();return pos;
}
function selectToken(line,col){
  const pos=gotoLine(line,col);const m=ta.value.slice(pos).match(/^(\w+|\S)/);
  if(m)ta.setSelectionRange(pos,pos+m[0].length);
}

/* ============ files ============ */
const files=()=>store.get('bp7.files',{});
function setDoc(name,text,dirty){
  ta.value=text;cur={name,dirty:!!dirty};setTitle();ta.scrollTop=0;ta.scrollLeft=0;ta.setSelectionRange(0,0);render();
  store.set('bp7.cur',{name,text,dirty:!!dirty});
}
function normName(n){n=n.trim().toUpperCase().replace(/[^A-Z0-9_.\-]/g,'');if(!n)return '';if(!/\.[A-Z0-9]{1,3}$/.test(n))n=n.replace(/\.$/,'')+'.PAS';return n.slice(0,16)}
async function confirmSave(){
  if(!cur.dirty)return true;
  const r=await dialog({title:'Warning',body:cur.name+' has been modified.\nSave?',buttons:[{label:'Yes',value:'y',def:true},{label:'No',value:'n'},{label:'Cancel',value:null}]});
  if(r==='y')return await doSave();
  return r==='n';
}
async function doSave(as){
  let name=cur.name;
  if(as||/^NONAME/.test(name)){
    const r=await prompt1('Save file as','Save file as:',/^NONAME/.test(name)?'':name);
    if(r==null)return false;name=normName(r);if(!name)return false;
  }
  const f=files();f[name]=ta.value;store.set('bp7.files',f);
  cur={name,dirty:false};setTitle();updatePos();store.set('bp7.cur',{name,text:ta.value,dirty:false});
  return true;
}
function fileList(onlySaved){
  const f=files(),out=[];
  Object.keys(f).sort().forEach(n=>out.push({n,size:f[n].length,saved:true}));
  if(!onlySaved)Object.keys(SAMPLES).sort().forEach(n=>{if(!(n in f))out.push({n,size:SAMPLES[n].length,saved:false})});
  return out;
}
async function openFile(del){
  if(!del&&!await confirmSave())return;
  const list=fileList(del);
  if(!list.length){await dialog({title:'Delete',body:'No saved files.',buttons:[{label:'OK',value:1,def:true}]});return}
  const body=el('div');
  const lab=el('label','',del?'Delete file:':'Name');
  const inp=el('input');inp.type='text';inp.value=del?list[0].n:'*.PAS';
  const lst=el('div','flist');let sel=0;
  const draw=()=>{lst.innerHTML='';list.forEach((it,i)=>{const d=el('div',i===sel?'sel':'',esc(it.n)+'<i>'+(it.saved?it.size+' B':'sample')+'</i>');d.onclick=()=>{sel=i;inp.value=it.n;draw()};d.ondblclick=()=>okBtn.click();lst.append(d)});const s=lst.querySelector('.sel');if(s)s.scrollIntoView({block:'nearest'})};
  const okBtn=null;
  body.append(lab,inp,lst);
  const res=await dialog({title:del?'Delete File':'Open a File',body,width:'46ch',
    onOpen(){draw();inp.focus();inp.select()},
    onKey(e){if(e.key==='ArrowDown'){sel=Math.min(list.length-1,sel+1);inp.value=list[sel].n;draw();e.preventDefault();return true}
      if(e.key==='ArrowUp'){sel=Math.max(0,sel-1);inp.value=list[sel].n;draw();e.preventDefault();return true}},
    buttons:[{label:del?'Delete':'Open',value:'ok',def:true},{label:'Cancel',value:null}]});
  if(res!=='ok')return;
  const nm=normName(inp.value==='*.PAS'?list[sel].n:inp.value);
  const f=files();
  if(del){delete f[nm];store.set('bp7.files',f);return}
  if(nm in f)setDoc(nm,f[nm]);
  else if(nm in SAMPLES)setDoc(nm,SAMPLES[nm]);
  else await dialog({title:'Error',body:'File not found:\n'+nm,buttons:[{label:'OK',value:1,def:true}]});
}
async function newFile(){
  if(!await confirmSave())return;
  const f=files();let i=0,n;do{n='NONAME'+String(i++).padStart(2,'0')+'.PAS'}while(n in f);
  setDoc(n,'',false);ta.focus();
}

/* ============ dialogs ============ */
let dlgDepth=0;
function dialog(o){
  return new Promise(res=>{
    dlgDepth++;
    const ov=el('div','ovl'),d=el('div','dlg');
    if(o.width)d.style.width=o.width;
    d.append(el('div','dttl',esc(o.title||'')));
    const b=el('div','dbody'+(o.pre?' pre':''));
    if(typeof o.body==='string')b.textContent=o.body;else if(o.body)b.append(o.body);
    d.append(b);
    const bar=el('div','dbtns');d.append(bar);
    let def=null;
    const close=v=>{window.removeEventListener('keydown',kd,true);ov.remove();dlgDepth--;res(v);if(!userVisible())setTimeout(()=>ta.focus(),0)};
    (o.buttons||[]).forEach(x=>{const bt=el('button','btn'+(x.def?' def':''),esc(x.label));bt.onclick=()=>close(x.value);bar.append(bt);if(x.def)def=bt});
    const kd=e=>{
      if(!ov.isConnected)return;
      if(o.onKey&&o.onKey(e))return;
      if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close(null)}
      else if(e.key==='Enter'&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();e.stopPropagation();if(def)def.click()}
    };
    window.addEventListener('keydown',kd,true);
    ov.append(d);$('#dlgroot').append(ov);
    if(o.onOpen)o.onOpen();else (def||d).focus();
  });
}
async function prompt1(title,label,init){
  const body=el('div');const l=el('label','',esc(label));const i=el('input');i.type='text';i.value=init||'';body.append(l,i);
  const r=await dialog({title,body,width:'40ch',onOpen(){i.focus();i.select()},buttons:[{label:'OK',value:'ok',def:true},{label:'Cancel',value:null}]});
  return r==='ok'?i.value:null;
}
function anyKey(title,lines){
  return new Promise(res=>{
    dlgDepth++;
    const ov=el('div','ovl'),d=el('div','dlg');d.style.width='56ch';
    d.append(el('div','dttl',esc(title)));
    const b=el('div','dbody pre');b.innerHTML=lines;d.append(b);ov.append(d);$('#dlgroot').append(ov);
    const done=e=>{if(e&&e.type==='keydown'&&['Shift','Control','Alt','Meta'].includes(e.key))return;if(e)e.preventDefault();window.removeEventListener('keydown',done,true);ov.remove();dlgDepth--;res();setTimeout(()=>ta.focus(),0)};
    window.addEventListener('keydown',done,true);ov.addEventListener('pointerdown',done);
  });
}

/* ============ menus ============ */
const I=(l,a,k,x)=>Object.assign({l,a,k:k||''},x||{});
const MENUS=[

class Screen{
  constructor(cv){
    this.cv=cv;this.ctx=cv.getContext('2d');this.cols=80;this.rows=25;this.W=9;this.H=16;
    this.ch=new Uint8Array(2000);this.at=new Uint8Array(2000);this.rowDirty=new Uint8Array(25).fill(1);
    this.phase=true;this.curOn=true;this.reset();
  }
  reset(){this.ch.fill(32);this.at.fill(7);this.x=0;this.y=0;this.fg=7;this.bg=0;this.blink=0;this.win=[0,0,79,24];this.rowDirty.fill(1)}
  attr(){return this.fg|(this.bg<<4)|(this.blink?128:0)}
  setFg(c){this.fg=c&15;this.blink=c&128}
  setBg(c){this.bg=c&7}
  clrscr(){const[a,b,c,d]=this.win,at=this.attr();for(let y=b;y<=d;y++)for(let x=a;x<=c;x++){this.ch[y*80+x]=32;this.at[y*80+x]=at}this.x=a;this.y=b;this.rowDirty.fill(1)}
  clreol(){const at=this.attr();for(let x=this.x;x<=this.win[2];x++){this.ch[this.y*80+x]=32;this.at[this.y*80+x]=at}this.rowDirty[this.y]=1}
  gotoxy(x,y){const[a,b,c,d]=this.win;this.x=Math.max(a,Math.min(c,a+x-1));this.y=Math.max(b,Math.min(d,b+y-1))}
  window(x1,y1,x2,y2){if(x1<1||y1<1||x2>80||y2>25||x1>x2||y1>y2)return;this.win=[x1-1,y1-1,x2-1,y2-1];this.x=x1-1;this.y=y1-1}
  scroll(){const[a,b,c,d]=this.win,at=this.attr();for(let y=b;y<d;y++)for(let x=a;x<=c;x++){this.ch[y*80+x]=this.ch[(y+1)*80+x];this.at[y*80+x]=this.at[(y+1)*80+x]}
    for(let x=a;x<=c;x++){this.ch[d*80+x]=32;this.at[d*80+x]=at}this.rowDirty.fill(1)}
  lf(){if(this.y>=this.win[3])this.scroll();else this.y++}
  write(s){
    for(let i=0;i<s.length;i++){
      const c=s[i];
      if(c==='\r'){this.x=this.win[0];continue}
      if(c==='\n'){this.lf();continue}
      if(c==='\b'){if(this.x>this.win[0])this.x--;continue}
      if(c==='\u0007'){beep(800,90);continue}
      if(c==='\t'){this.x=Math.min(this.win[2],(this.x+8)&~7);continue}
      const code=c==='\u0000'?32:P.toCode(c);
      const p=this.y*80+this.x;this.ch[p]=code;this.at[p]=this.attr();this.rowDirty[this.y]=1;
      if(this.x>=this.win[2]){this.x=this.win[0];this.lf()}else this.x++;
    }
  }
  size(W,H){
    this.W=W;this.H=H;const dpr=window.devicePixelRatio||1;
    this.cv.style.width=80*W+'px';this.cv.style.height=25*H+'px';
    this.cv.width=Math.round(80*W*dpr);this.cv.height=Math.round(25*H*dpr);
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
    this.font=Math.round(H*0.98)+'px VT323, "Lucida Console", monospace';
    this.ctx.font=this.font;const adv=this.ctx.measureText('M').width||W;this.sx=Math.min(1.8,W/adv);
    this.rowDirty.fill(1);
  }
  box(spec,x0,y0){
    const c=this.ctx,W=this.W,H=this.H,[L,R,U,D]=spec,t=Math.max(1,Math.round(H/16)),o=Math.max(2*t,Math.round(H/9)),cx=W>>1,cy=H>>1;
    const ys=w=>w===1?[cy]:[cy-o,cy+o],xs=w=>w===1?[cx]:[cx-o,cx+o];
    const harm=(w,side)=>{if(!w)return;for(const y of ys(w)){
      const top=w===2&&y<cy,bot=w===2&&y>cy,inner=(top&&U>0)||(bot&&D>0);let e;
      if(inner){const vw=top?U:D;e=side<0?(vw===2?cx-o:cx):(vw===2?cx+o:cx)}
      else{const vm=Math.max(U,D);e=side<0?(vm===2?cx+o:cx):(vm===2?cx-o:cx)}
      if(side<0)c.fillRect(x0,y0+y,e+t,t);else c.fillRect(x0+e,y0+y,W-e,t)}};
    const varm=(w,side)=>{if(!w)return;for(const x of xs(w)){
      const l=w===2&&x<cx,r=w===2&&x>cx,inner=(l&&L>0)||(r&&R>0);let e;
      if(inner){const hw=l?L:R;e=side<0?(hw===2?cy-o:cy):(hw===2?cy+o:cy)}
      else{const hm=Math.max(L,R);e=side<0?(hm===2?cy+o:cy):(hm===2?cy-o:cy)}
      if(side<0)c.fillRect(x0+x,y0,t,e+t);else c.fillRect(x0+x,y0+e,t,H-e)}};
    harm(L,-1);harm(R,1);varm(U,-1);varm(D,1);
  }
  cell(cx,cy){
    const c=this.ctx,W=this.W,H=this.H,i=cy*80+cx,code=this.ch[i],a=this.at[i],x0=cx*W,y0=cy*H;
    c.fillStyle=PAL[(a>>4)&7];c.fillRect(x0,y0,W,H);
    const isCur=this.curOn&&this.phase&&cx===this.x&&cy===this.y&&this.showCursor;
    if(code!==32&&code!==0&&(!(a&128)||this.phase)){
      c.fillStyle=PAL[a&15];
      const hh=H>>1,hw=W>>1;
      switch(code){
        case 219:c.fillRect(x0,y0,W,H);break;
        case 220:c.fillRect(x0,y0+hh,W,H-hh);break;
        case 223:c.fillRect(x0,y0,W,hh);break;
        case 221:c.fillRect(x0,y0,hw,H);break;
        case 222:c.fillRect(x0+hw,y0,W-hw,H);break;
        case 176:case 177:case 178:c.globalAlpha=code===176?.28:code===177?.5:.75;c.fillRect(x0,y0,W,H);c.globalAlpha=1;break;
        default:{
          const g=P.CP[code],bx=BOX[g];
          if(bx)this.box(bx,x0,y0);
          else{c.save();c.translate(x0,y0);c.scale(this.sx,1);c.font=this.font;c.textAlign='center';c.textBaseline='middle';c.fillText(g,W/(2*this.sx),H*0.54);c.restore()}
        }
      }
    }
    if(isCur){c.fillStyle=PAL[a&15];c.fillRect(x0,y0+H-Math.max(2,Math.round(H/8)),W,Math.max(2,Math.round(H/8)))}
  }
  draw(){
    for(let y=0;y<25;y++){if(!this.rowDirty[y])continue;this.rowDirty[y]=0;for(let x=0;x<80;x++)this.cell(x,y)}
  }

/* ============ keyboard queue ============ */
const keyq=[];let waiters=[];
function pushKey(c){keyq.push(c);if(keyq.length>128)keyq.shift();while(waiters.length&&keyq.length)waiters.shift()(keyq.shift())}
function nextKey(){return keyq.length?keyq.shift():new Promise(r=>waiters.push(r))}
const EXT={ArrowUp:72,ArrowDown:80,ArrowLeft:75,ArrowRight:77,Home:71,End:79,PageUp:73,PageDown:81,Insert:82,Delete:83};
function keyChars(e){
  const k=e.key;
  if(k in EXT)return ['\u0000',String.fromCharCode(EXT[k])];
  if(/^F\d+$/.test(k)){const n=+k.slice(1);if(n>=1&&n<=10)return ['\u0000',String.fromCharCode(58+n)];if(n===11)return ['\u0000',P._chr(133)];if(n===12)return ['\u0000',P._chr(134)];return null}
  if(k==='Enter')return ['\r'];if(k==='Backspace')return ['\b'];if(k==='Tab')return ['\t'];if(k==='Escape')return [P._chr(27)];
  if(e.ctrlKey&&!e.altKey&&k.length===1&&/[a-z]/i.test(k))return [P._chr(k.toUpperCase().charCodeAt(0)-64)];
  if(k.length===1&&!e.ctrlKey&&!e.metaKey){const c=k.charCodeAt(0);return [c<128?k:(P.toCode(k)!==63?k:'?')]}
  return null;
}

    const k=await nextKey();
    if(k==='\r'){screen.write('\r\n');return s}
    if(k==='\b'){if(s.length){s=s.slice(0,-1);screen.write('\b \b')}continue}
    if(k==='\u0000'){await nextKey();continue}
    if(k.length===1&&k.charCodeAt(0)>=32&&s.length<127){s+=k;screen.write(k)}
  }
}
const inp={buf:null};
const host={
  write:s=>screen.write(s),
  async readValue(kind){
    for(;;){
      if(inp.buf===null)inp.buf=await fetchLine();
      if(kind==='s'){const r=inp.buf;inp.buf='';return r}
      if(kind==='c'){if(inp.buf.length){const c=inp.buf[0];inp.buf=inp.buf.slice(1);return c}inp.buf=null;return '\r'}
      inp.buf=inp.buf.replace(/^\s+/,'');
      if(!inp.buf.length){inp.buf=null;continue}
      const t=inp.buf.match(/^\S+/)[0];inp.buf=inp.buf.slice(t.length);
      if(kind==='i'){if(!/^[+-]?\d+$/.test(t))throw new P.RTE(106);return parseInt(t,10)}
      const v=Number(t);if(isNaN(v))throw new P.RTE(106);return v;
    }
  },
  async readln(){if(inp.buf===null)await fetchLine();inp.buf=null},
  readKey:()=>nextKey(),
  keyPressed:()=>keyq.length>0,
  delay:ms=>new Promise(r=>setTimeout(r,Math.max(0,ms))),
  clrscr:()=>screen.clrscr(),clreol:()=>screen.clreol(),gotoxy:(x,y)=>screen.gotoxy(x,y),
  whereX:()=>screen.x-screen.win[0]+1,whereY:()=>screen.y-screen.win[1]+1,
  textcolor:c=>screen.setFg(c),textbackground:c=>screen.setBg(c),
  normvideo(){screen.fg=7;screen.blink=0},highvideo(){screen.fg|=8},lowvideo(){screen.fg&=7},
  window:(a,b,c,d)=>screen.window(a,b,c,d),
  sound(f){const c=audio();if(!c)return;try{if(osc)osc.stop();osc=c.createOscillator();const g=c.createGain();g.gain.value=.04;osc.type='square';osc.frequency.value=f;osc.connect(g);g.connect(c.destination);osc.start()}catch(e){}},
  nosound(){try{if(osc)osc.stop()}catch(e){}osc=null},
  getTime(h,m,s,c){const d=new Date();h.c[h.k]=d.getHours();m.c[m.k]=d.getMinutes();s.c[s.k]=d.getSeconds();c.c[c.k]=Math.floor(d.getMilliseconds()/10)},
  getDate(y,m,d,w){const t=new Date();y.c[y.k]=t.getFullYear();m.c[m.k]=t.getMonth()+1;d.c[d.k]=t.getDate();w.c[w.k]=t.getDay()}
};
/* user screen overlay */
function userVisible(){return userEl.style.display==='flex'}
function showUser(fresh){
  userEl.style.display='flex';closeMenu(false);sizeScreen();screen.rowDirty.fill(1);
  setFoot();$('#kb').focus({preventScroll:true});
}
function leaveUser(){
  userEl.style.display='none';ta.focus();
  if(pendingErr){const e=pendingErr;pendingErr=null;showError((P.RTE_MSG[e.rte]||'Runtime error')+'',e.rte,e.line,1,true)}
}
let pendingErr=null;
function setFoot(){
  foot.innerHTML='';
  if(running&&!dosMode){foot.append(el('span','','Program running — <b>Ctrl+C</b> stops it'));const b=el('button','','Stop');b.onclick=()=>vm&&vm.abort();foot.append(b)}
  else if(!dosMode){foot.append(el('span','','<b>Press any key</b> to return to the IDE'));const b=el('button','','Back to IDE');b.onclick=leaveUser;foot.append(b)}
  else foot.append(el('span','','MS-DOS prompt — type <b>BP</b> to start Pascal again'));
}
$('#uwrap').addEventListener('pointerdown',()=>$('#kb').focus());
$('#kb').addEventListener('input',e=>{const v=e.target.value;e.target.value='';if(running||dosMode)for(const c of v)if(c.charCodeAt(0)>=32)pushKey(c)});
async function runProgram(){
  if(running)return;
  const prog=compileSrc();if(!prog)return;
  keyq.length=0;waiters=[];inp.buf=null;screen.reset();screen.clrscr();
  lastRan=true;running=true;dosMode=false;pendingErr=null;
  vm=new P.VM(prog,host);showUser(true);
  let res;
  try{res=await vm.exec(tick)}catch(e){res={rte:216,line:0}}
  running=false;host.nosound();
  if(res.rte){
    const hex=(res.line*16).toString(16).toUpperCase().padStart(4,'0');
    screen.write('\r\nRuntime error '+res.rte+' at 0001:'+hex+'.\r\n');
    pendingErr=res;
  }
  vm=null;setFoot();
}
async function dosShell(){
  if(running)return;
  dosMode=true;keyq.length=0;waiters=[];screen.reset();screen.fg=7;
  showUser(true);
  screen.write('\r\nBorland Pascal browser edition.\r\nThe IDE has been closed.\r\n\r\n');
  for(;;){
    screen.write('C:\\BP\\BIN>');
    const cmd=(await fetchLine()).trim().toLowerCase();
    if(cmd==='bp'||cmd==='bp.exe'||cmd==='turbo'){break}
    else if(cmd==='cls')screen.clrscr();
    else if(cmd==='ver')screen.write('\r\nBorland Pascal 7.0 (clone) \r\n\r\n');
    else if(cmd==='dir'){screen.write('\r\n Volume in drive C is BORLAND\r\n Directory of C:\\BP\\BIN\r\n\r\n');const f=fileList(true);f.forEach(x=>screen.write(' '+x.n.padEnd(14)+String(x.size).padStart(8)+'\r\n'));screen.write('        '+f.length+' file(s)\r\n\r\n')}
    else if(cmd==='help')screen.write('\r\nCommands: BP, DIR, VER, CLS, HELP\r\n\r\n');
    else if(cmd)screen.write('Bad command or file name\r\n');
  }
  dosMode=false;leaveUser();
}

/* ============ global keys ============ */
window.addEventListener('keydown',e=>{
  if(dlgDepth>0)return;
  if(userVisible()){
    if(e.key==='Unidentified'||e.isComposing||e.keyCode===229)return;
    if(['Shift','Control','Alt','Meta','CapsLock'].includes(e.key))return;
    if(!running&&!dosMode){e.preventDefault();leaveUser();return}
    if((e.ctrlKey&&(e.key==='c'||e.key==='C'))||e.key==='Pause'){e.preventDefault();if(vm)vm.abort();return}
    const ch=keyChars(e);if(ch){e.preventDefault();ch.forEach(pushKey)}
    return;
  }
  if(lastErr){if(['Shift','Control','Alt','Meta'].includes(e.key))return;hideError();if(e.key==='Escape'||e.key==='Enter'){e.preventDefault();return}}
  if(menu){
    const k=e.key,n=MENUS.length;
    if(k==='Escape'||k==='F10'){e.preventDefault();closeMenu();return}
    if(k==='ArrowLeft'){e.preventDefault();openMenu((menu.i+n-1)%n);return}
    if(k==='ArrowRight'){e.preventDefault();openMenu((menu.i+1)%n);return}
    if(k==='ArrowDown'){e.preventDefault();stepSel(1);return}
    if(k==='ArrowUp'){e.preventDefault();stepSel(-1);return}
    if(k==='Enter'){e.preventDefault();if(menu.sel>=0)activate(menu.sel);return}
    if(k.length===1&&!e.ctrlKey){
      const lc=k.toLowerCase(),idx=MENUS[menu.i].items.findIndex(it=>it&&!it.off&&hkOf(it.l)===lc);
      if(idx>=0){e.preventDefault();activate(idx)}
    }
    return;
  }
  const k=e.key,F=/^F\d+$/.test(k)?+k.slice(1):0;
  if(e.altKey&&!e.ctrlKey){
    if(k==='x'||k==='X'){e.preventDefault();ACT.exit();return}
    if(F===9){e.preventDefault();ACT.compile();return}
    if(F===5){e.preventDefault();ACT.usr();return}
    if(F===3){e.preventDefault();ACT.new();return}
    if(k.length===1){const i=MENUS.findIndex(m=>hkOf(m.n)===k.toLowerCase());if(i>=0){e.preventDefault();openMenu(i);return}}
    return;
  }
  if(e.ctrlKey&&!e.altKey){
    if(F===9){e.preventDefault();ACT.run();return}
    if(F===2){e.preventDefault();ACT.reset();return}
    const lk=k.toLowerCase();
    if(lk==='s'){e.preventDefault();ACT.save();return}
    if(lk==='f'){e.preventDefault();ACT.find();return}
    if(lk==='l'){e.preventDefault();ACT.again();return}
    if(lk==='g'){e.preventDefault();ACT.goto();return}
    return;
  }
  if(F){
    const m={1:'help',2:'save',3:'open',9:'make'}[F];
    if(m){e.preventDefault();ACT[m]();return}
    if(F===10){e.preventDefault();openMenu(1);return}
    if(F===5||F===6||F===7||F===8||F===4){e.preventDefault()}
  }
});

/* ============ start-up ============ */
SAMPLES['HELLO.PAS']&&0;
const saved=store.get('bp7.cur',null);
measureRatio();layout();
if(saved&&typeof saved.text==='string')setDoc(saved.name||'NONAME00.PAS',saved.text,saved.dirty);
else setDoc('HELLO.PAS',SAMPLES['HELLO.PAS']||'',false);
if(document.fonts&&document.fonts.load){document.fonts.load('20px VT323').then(()=>{measureRatio();layout();screen.rowDirty.fill(1)}).catch(()=>{})}
window.addEventListener('resize',()=>{layout();render()});
ta.focus();
screen.write('');
})();
